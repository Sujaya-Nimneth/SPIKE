name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/spike-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=spike-release.jks
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release_artifacts
          APK_NAME="spike-${{ steps.meta.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/${APK_NAME}"
          (cd release_artifacts && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          ls -lh release_artifacts

      - name: Clean up signing files
        if: always()
        shell: bash
        run: rm -f android/app/spike-release.jks android/key.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Spike ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release_artifacts/spike-${{ steps.meta.outputs.tag }}.apk
            release_artifacts/spike-${{ steps.meta.outputs.tag }}.apk.sha256
